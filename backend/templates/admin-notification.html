<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}} - SMALIM</title>
</head>
<body style="margin:0;padding:0;background:#f5f9f6;font-family:'Helvetica Neue',Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f9f6;padding:40px 20px;">
    <tr><td align="center">
      <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">
        <tr>
          <td style="background:#00272B;border-radius:16px 16px 0 0;padding:24px 40px;">
            <p style="color:#4FD07A;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin:0;">Back-office SMALIM</p>
          </td>
        </tr>
        <tr>
          <td style="background:#ffffff;padding:36px 40px;">
            <h1 style="color:#00272B;font-size:20px;font-weight:700;margin:0 0 8px;">{{title}}</h1>
            <p style="color:rgba(0,39,43,0.65);font-size:14px;line-height:1.6;margin:0 0 24px;">{{intro}}</p>
            <table width="100%" cellpadding="0" cellspacing="0" style="border-top:1px solid #eef2ef;border-bottom:1px solid #eef2ef;padding:8px 0;">
              {{rows}}
            </table>
            <div style="text-align:center;margin:28px 0 0;">
              <a href="{{link}}" style="display:inline-block;background:#1AAA3F;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:12px 28px;border-radius:10px;">
                {{linkLabel}}
              </a>
            </div>
          </td>
        </tr>
        <tr>
          <td style="background:#f0f9f4;border-radius:0 0 16px 16px;padding:20px 40px;text-align:center;border-top:1px solid #e8f5ee;">
            <p style="color:rgba(0,39,43,0.4);font-size:12px;margin:0;">
              © {{year}} SMALIM - notification automatique, réglable dans Paramètres → Notifications
            </p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
